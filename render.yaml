# Render Blueprint: one free web service that serves the API and the built React app.
# Render > New > Blueprint > pick this repository. It asks for MONGODB_URI (your MongoDB Atlas connection string);
# JWT_SECRET is generated by Render and never shown in the repository.
services:
  - type: web
    name: campus-lost-found
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # Loads the demo accounts and sample reports on the first start, only while the database is empty.
      # Remove this variable (and change the demo passwords) for anything that is not a demo.
      - key: SEED_DEMO_DATA
        value: "true"
